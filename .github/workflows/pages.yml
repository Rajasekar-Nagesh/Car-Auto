# Publishes the app to GitHub Pages (free HTTPS hosting, needed for GPS,
# microphone and "install app" on the stereo and phones).
# One-time setup: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, Main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android apps
        run: gradle -p android assembleRelease --no-daemon
      - name: Collect site files
        run: |
          mkdir -p _site/apk
          cp -r index.html car.html phone.html sw.js manifest-*.webmanifest css js vendor icons _site/
          cp android/dash/build/outputs/apk/release/dash-release.apk _site/apk/car-auto-dash.apk
          cp android/link/build/outputs/apk/release/link-release.apk _site/apk/car-auto-link.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
