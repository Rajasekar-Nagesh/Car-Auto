# Builds the two Android apps on every change:
#   car-auto-dash.apk  -> install on the car stereo
#   car-auto-link.apk  -> install on your Android phone
# Download them from the run's "Artifacts" section (or from the published site, see pages.yml).
name: Build Android apps

on:
  push:
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - '*.html'
      - 'vendor/**'
      - 'icons/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APKs
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Rename APKs
        run: |
          mkdir -p apk
          cp android/dash/build/outputs/apk/release/dash-release.apk apk/car-auto-dash.apk
          cp android/link/build/outputs/apk/release/link-release.apk apk/car-auto-link.apk
      - uses: actions/upload-artifact@v4
        with:
          name: car-auto-apks
          path: apk/*.apk
